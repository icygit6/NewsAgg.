services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    env_file: ./server/.env          # loads NeonDB URL + all API keys at runtime
    environment:
      NODE_ENV: production
      PORT: 3000                      # operational override; .env has no PORT
      CLIENT_URL: "${CLIENT_URL:-http://localhost:8080}"   # CORS — direct Docker or IIS public origin
      GEMINI_TRANSLATE_MODEL: "${GEMINI_TRANSLATE_MODEL:-gemini-3.5-flash-lite}"
      GROQ_CHAT_MODEL: "${GROQ_CHAT_MODEL:-openai/gpt-oss-120b}"
      GROQ_CHAT_FALLBACK_MODEL: "${GROQ_CHAT_FALLBACK_MODEL:-llama-3.3-70b-versatile}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-}"
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Public demo URL without a domain. The generated trycloudflare.com address
  # is printed by SHOW-PUBLIC-URL.ps1 and may change when this service restarts.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://client:80
    depends_on:
      client:
        condition: service_healthy
    restart: unless-stopped

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    env_file: ./server/.env          # NEONDB_URL + GEMINI_API_KEY + HF_TOKEN live here
    environment:
      GEMINI_TRANSLATE_MODEL: "${GEMINI_TRANSLATE_MODEL:-gemini-3.5-flash-lite}"
    volumes:
      - hf_cache:/root/.cache/huggingface
    profiles:
      - scraper
    restart: "no"

volumes:
  hf_cache:
