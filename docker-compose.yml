services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    env_file: ./server/.env          # loads NeonDB URL + all API keys at runtime
    environment:
      NODE_ENV: production
      PORT: 3000                      # operational override; .env has no PORT
      CLIENT_URL: "${CLIENT_URL:-http://localhost:8080}"   # comma-separated CORS origins
      PUBLIC_CLIENT_URL: "${PUBLIC_CLIENT_URL:-http://localhost:8080}"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      GEMINI_TRANSLATE_MODEL: "${GEMINI_TRANSLATE_MODEL:-gemini-3.5-flash-lite}"
      GROQ_CHAT_MODEL: "${GROQ_CHAT_MODEL:-openai/gpt-oss-120b}"
      GROQ_CHAT_FALLBACK_MODEL: "${GROQ_CHAT_FALLBACK_MODEL:-llama-3.3-70b-versatile}"
      TWELVE_DATA_API_KEY: "${TWELVE_DATA_API_KEY:-}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    volumes:
      - market_cache:/app/.cache

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-}"
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
        VITE_TURNSTILE_SITE_KEY: "${VITE_TURNSTILE_SITE_KEY:-}"
        VITE_SENTRY_DSN: "${VITE_SENTRY_DSN:-}"
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Temporary demo tunnel. START-NEWSAGG.ps1 uses this only when a named-tunnel
  # token has not been configured. Its trycloudflare.com URL is not permanent.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://client:80
    depends_on:
      client:
        condition: service_healthy
    restart: unless-stopped

  # Permanent public tunnel. Create it in Cloudflare Zero Trust, add a public
  # hostname that targets http://client:80, then put the token in root .env.
  # The profile prevents an empty token from breaking local/quick-tunnel use.
  tunnel-named:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    depends_on:
      client:
        condition: service_healthy
    profiles:
      - production
    restart: unless-stopped

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    env_file:
      - path: ./server/.env         # NEONDB_URL + application API keys
        required: true
      - path: ./server/.hf.env      # local Hugging Face token; ignored by Git
        required: false
    environment:
      GEMINI_TRANSLATE_MODEL: "${GEMINI_TRANSLATE_MODEL:-gemini-3.5-flash-lite}"
    volumes:
      - hf_cache:/root/.cache/huggingface
    profiles:
      - scraper
    restart: "no"

volumes:
  hf_cache:
  market_cache:
