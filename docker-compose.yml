services:
  # Local PostgreSQL 18 + pgvector. Replaced Neon on 19 Oct 2026 after the free
  # compute-hour quota ran out. Data lives in the pgdata volume; containers use
  # host "db", host-side scripts use 127.0.0.1:5433 from server/.env.
  db:
    build:
      context: ./deploy/postgres
    environment:
      POSTGRES_USER: newsagg
      POSTGRES_DB: newsagg
      POSTGRES_PASSWORD: "${NEWSAGG_DB_PASSWORD:?set NEWSAGG_DB_PASSWORD in .env}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "newsagg", "-d", "newsagg"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 1g
    restart: unless-stopped

  # Read-only table browser. Admins open it at /dbviewer/ on the site, where
  # Nginx first asks the API whether the session belongs to an admin; on this
  # laptop it is also at http://127.0.0.1:8081/dbviewer/. It logs in as
  # newsagg_viewer (deploy/postgres/viewer-role.sql): read-only, no secrets.
  dbviewer:
    image: mirror.gcr.io/sosedoff/pgweb:0.16.2
    command: ["pgweb", "--bind=0.0.0.0", "--listen=8081", "--prefix=dbviewer", "--readonly", "--lock-session", "--skip-open"]
    environment:
      PGWEB_DATABASE_URL: "postgres://newsagg_viewer:${NEWSAGG_DBVIEWER_PASSWORD}@db:5432/newsagg?sslmode=disable"
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    env_file: ./server/.env          # API keys; the database URL is overridden below
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEONDB_URL: "postgres://newsagg:${NEWSAGG_DB_PASSWORD}@db:5432/newsagg"
      DATABASE_URL: "postgres://newsagg:${NEWSAGG_DB_PASSWORD}@db:5432/newsagg"
      NODE_ENV: production
      PORT: 3000                      # operational override; .env has no PORT
      CLIENT_URL: "${NEWSAGG_STABLE_URL:-${CLIENT_URL:-http://localhost:8080}}"
      PUBLIC_CLIENT_URL: "${NEWSAGG_STABLE_URL:-${PUBLIC_CLIENT_URL:-http://localhost:8080}}"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      GEMINI_TRANSLATE_MODEL: "${GEMINI_TRANSLATE_MODEL:-gemini-3.5-flash-lite}"
      GROQ_CHAT_MODEL: "${GROQ_CHAT_MODEL:-openai/gpt-oss-120b}"
      GROQ_CHAT_FALLBACK_MODEL: "${GROQ_CHAT_FALLBACK_MODEL:-openai/gpt-oss-20b}"
      CHAT_MODEL_LABEL: "${CHAT_MODEL_LABEL:-}"   # optional override for the chat button label
      TWELVE_DATA_API_KEY: "${TWELVE_DATA_API_KEY:-}"
      TURNSTILE_SECRET: "${TURNSTILE_SECRET:-}"
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
      LOCAL_AI_URL: http://local-ai:8090
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    volumes:
      - market_cache:/app/.cache

  client:
    entrypoint: ["nginx", "-g", "daemon off;"]
    command: []
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-}"
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
        VITE_TURNSTILE_SITE_KEY: "${VITE_TURNSTILE_SITE_KEY:-}"
        VITE_SENTRY_DSN: "${VITE_SENTRY_DSN:-}"
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Free temporary Quick Tunnel. The public trycloudflare.com URL changes when
  # this container is recreated; no Cloudflare account or custom domain needed.
  tunnel:
    # Pinned for reproducible deploys. Quick Tunnels remain a free preview
    # service; a named tunnel can be supplied later without changing the app.
    image: cloudflare/cloudflared:2026.9.0
    command: tunnel --no-autoupdate --retries 3 --metrics 0.0.0.0:2000 --url http://client:80
    depends_on:
      client:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "0.0.0.0:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  local-ai:
    build:
      context: ./scraper
      dockerfile: Dockerfile.ai
    command: ["python", "local_ai.py"]
    env_file:
      - path: ./server/.hf.env
        required: false
    environment:
      AI_CPU_THREADS: "2"
    volumes:
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    env_file:
      - path: ./server/.env         # application API keys; database URL overridden below
        required: true
      - path: ./server/.hf.env      # local Hugging Face token; ignored by Git
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEONDB_URL: "postgres://newsagg:${NEWSAGG_DB_PASSWORD}@db:5432/newsagg"
      DATABASE_URL: "postgres://newsagg:${NEWSAGG_DB_PASSWORD}@db:5432/newsagg"
      # The 400 MB default mirrored Neon's free storage; the local volume can
      # hold far more, so ingestion only stops near 5 GB.
      SCRAPER_STORAGE_BUDGET_MB: "${SCRAPER_STORAGE_BUDGET_MB:-5000}"
      GEMINI_TRANSLATE_MODEL: "${GEMINI_TRANSLATE_MODEL:-gemini-3.5-flash-lite}"
      LOCAL_AI_URL: http://local-ai:8090
    volumes:
      - hf_cache:/root/.cache/huggingface
    profiles:
      - scraper
    restart: "no"

volumes:
  pgdata:
  hf_cache:
  market_cache:
