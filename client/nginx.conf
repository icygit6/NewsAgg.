# Cloudflare Tunnel supplies CF-Connecting-IP. Local Docker access does not,
# so fall back to the direct peer address. Express trusts exactly this Nginx
# hop and can therefore enforce rate limits per real visitor.
map $http_cf_connecting_ip $newsagg_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

map $http_x_forwarded_proto $newsagg_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Resolve the backend again after container recreation (e.g. tunnel update).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $newsagg_backend http://server:3000;

    # Gzip Compression untuk mengecilkan ukuran transfer file
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Routing SPA (Single Page Application) React/Vite
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /index.html =404;
    }

    # Same-origin API access when the Docker client port is opened directly.
    # IIS handles these paths itself when traffic enters through port 80.
    location /api/ {
        proxy_read_timeout 110s;
        proxy_pass $newsagg_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $newsagg_client_ip;
        proxy_set_header X-Forwarded-Proto $newsagg_forwarded_proto;
    }

    # Database viewer for admins only. Every request is first checked against
    # the API; anything but 2xx from /api/admin/check is refused.
    location = /_admin_check {
        internal;
        proxy_pass $newsagg_backend/api/admin/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $newsagg_client_ip;
        proxy_set_header X-Forwarded-Proto $newsagg_forwarded_proto;
    }
    location = /dbviewer {
        absolute_redirect off;
        return 301 /dbviewer/;
    }
    # ^~ keeps the static-file regex locations below from taking pgweb's assets.
    location ^~ /dbviewer/ {
        auth_request /_admin_check;
        error_page 401 403 = @dbviewer_denied;
        set $newsagg_dbviewer http://dbviewer:8081;
        proxy_pass $newsagg_dbviewer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "private, no-store" always;
        add_header X-Frame-Options "DENY" always;
    }
    location @dbviewer_denied {
        absolute_redirect off;
        return 302 /admin;
    }

    location /auth/ {
        proxy_pass $newsagg_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $newsagg_client_ip;
        proxy_set_header X-Forwarded-Proto $newsagg_forwarded_proto;
    }

    location = /health {
        proxy_pass $newsagg_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $newsagg_client_ip;
        proxy_set_header X-Forwarded-Proto $newsagg_forwarded_proto;
    }

    # Machine-readable files must exist or 404. The SPA fallback below used to
    # answer them with index.html (HTTP 200), which agents and crawlers read
    # as a malformed robots/llms/ai-catalog document.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }
    location ~* \.(?:txt|json|xml|webmanifest)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Cache JS/CSS aggressively (Vite emits content-hashed filenames); keep index.html no-store.
    location ~* \.(?:css|js)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache media/fonts briefly; these are not the data-fetching application bundle.
    location ~* \.(?:ico|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webp)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }
}
