name: Scraper

on:
  schedule:
    # GitHub cron is UTC. 19:00 UTC = 03:00 Asia/Taipei (next day).
    - cron: "0 19 * * *"
    # Weekly cleanup: Sunday 04:00 Asia/Taipei.
    - cron: "0 20 * * 6"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [scrape, cleanup, backfill-lang]
        default: scrape
      target:
        description: "Articles per category per source (default 20)"
        type: number
        default: 20

concurrency:
  group: newsagg-scraper
  cancel-in-progress: false

# Every job uses the laptop runner. This avoids billable GitHub-hosted minutes
# for the private repository and reuses locally cached Docker images and models.
jobs:
  scrape:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 19 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'scrape')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360
    steps:
      - name: Scrape all sources on the server laptop
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File 'D:\Website\RUN-SCRAPER.ps1' `
            -Target ${{ inputs.target || 20 }}

  cleanup:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 20 * * 6') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'cleanup')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Delete stale articles and vacuum
        shell: powershell
        run: |
          Set-Location -LiteralPath 'D:\Website'
          docker compose --profile scraper run --rm scraper python cleanup.py --days 45 --commit --vacuum
          if ($LASTEXITCODE -ne 0) { throw "Cleanup failed with exit code $LASTEXITCODE." }

  backfill-lang:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'backfill-lang'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Normalise Yahoo TW language codes
        shell: powershell
        run: |
          Set-Location -LiteralPath 'D:\Website'
          docker compose --profile scraper run --rm scraper python backfill_lang.py --source yahoo_tw --lang zh-TW --commit
          if ($LASTEXITCODE -ne 0) { throw "Backfill failed with exit code $LASTEXITCODE." }
