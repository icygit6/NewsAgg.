
name: Scraper

on:
  schedule:
    # GitHub cron is UTC. 19:00 UTC = 03:00 Asia/Taipei (next day), two
    # hours before the daily email. Weekly cleanup: Sunday 04:00 Taipei.
    - cron: '0 19 * * *'
    - cron: '0 20 * * 6'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        type: choice
        options: [scrape, cleanup, backfill-lang]
        default: scrape
      target:
        description: 'Articles per category per source (scrape only, default 20)'
        type: number
        default: 20

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 19 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'scrape')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix:
        source: [cnn, bbc, aljazeera, yahoo_tw]
      fail-fast: false   # one source failing never blocks the others

    steps:
      - uses: actions/checkout@v4

      # Hosted runners include large Android/.NET/Haskell toolchains that this
      # Python scraper never uses. Reclaim the space before downloading the NLP
      # models; otherwise the multilingual sentiment model can fill the disk.
      - name: Free disk space for NLP models
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune --all --force || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v2-${{ hashFiles('scraper/core/config.py') }}
          restore-keys: hf-models-v2-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-v1

      - name: Install dependencies
        # Avoid keeping a second copy of large torch/transformers wheels.
        run: pip install --no-cache-dir -r scraper/requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Scrape ${{ matrix.source }}
        env:
          NEONDB_URL: ${{ secrets.NEONDB_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          TARGET=${{ github.event.inputs.target || 20 }}
          python scraper/run_single.py -s ${{ matrix.source }} --target $TARGET

  cleanup:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 20 * * 6') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'cleanup')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # cleanup.py only imports core.config + psycopg2 (no ML stack)
      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: Delete stale articles + vacuum
        env:
          NEONDB_URL: ${{ secrets.NEONDB_URL }}
        run: python scraper/cleanup.py --days 45 --commit --vacuum

  # One-off maintenance: normalise Yahoo TW articles mislabelled by langdetect
  # ('ko'/'zh-tw'/…) to canonical 'zh-TW'. Idempotent — safe to re-run.
  # Manual only (workflow_dispatch → job = backfill-lang).
  backfill-lang:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'backfill-lang'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # backfill_lang.py only imports core.config + psycopg2 (no ML stack)
      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: Normalise Yahoo TW language codes
        env:
          NEONDB_URL: ${{ secrets.NEONDB_URL }}
        run: python scraper/backfill_lang.py --source yahoo_tw --lang zh-TW --commit
