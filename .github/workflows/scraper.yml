name: Scraper

on:
  # 17:05 Asia/Taipei (Taiwan has no daylight-saving time).
  schedule:
    - cron: '5 9 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [scrape, full-recheck, cleanup, backfill-lang]
        default: scrape
concurrency:
  group: newsagg-daily-pipeline
  cancel-in-progress: false

# Every job uses the laptop runner. This avoids billable GitHub-hosted minutes
# for the private repository and reuses locally cached Docker images and models.
jobs:
  scrape:
    if: github.event_name == 'schedule' || inputs.job == 'scrape' || inputs.job == 'full-recheck'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360
    steps:
      - name: Ingest and publish news (idempotent daily run)
        if: github.event_name == 'schedule' || inputs.job == 'scrape'
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File 'D:\Website\RUN-NEWSAGG-DAILY.ps1' -Ingest
          if ($LASTEXITCODE -ne 0) { throw "News ingestion failed with exit code $LASTEXITCODE." }

      - name: Full recheck without daily email
        if: github.event_name == 'workflow_dispatch' && inputs.job == 'full-recheck'
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File 'D:\Website\RUN-NEWSAGG-DAILY.ps1' -Full
          if ($LASTEXITCODE -ne 0) { throw "Full recheck failed with exit code $LASTEXITCODE." }

  cleanup:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'cleanup'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Preview stale articles (no deletion)
        shell: powershell
        run: |
          Set-Location -LiteralPath 'D:\Website'
          docker compose --profile scraper run --rm scraper python cleanup.py --days 45
          if ($LASTEXITCODE -ne 0) { throw "Cleanup failed with exit code $LASTEXITCODE." }

  backfill-lang:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'backfill-lang'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Normalise Yahoo TW language codes
        shell: powershell
        run: |
          Set-Location -LiteralPath 'D:\Website'
          docker compose --profile scraper run --rm scraper python backfill_lang.py --source yahoo_tw --lang zh-TW --commit
          if ($LASTEXITCODE -ne 0) { throw "Backfill failed with exit code $LASTEXITCODE." }
