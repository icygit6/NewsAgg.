name: NewsAgg Daily Publish and Report

on:
  schedule:
    # GitHub cron is UTC. 21:00 UTC = 05:00 Asia/Taipei (next day).
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      recipients:
        description: "Email recipients, separated by commas / 電子郵件收件者（以逗號分隔）"
        required: false
        type: string

concurrency:
  group: newsagg-daily-publish
  cancel-in-progress: false

jobs:
  publish-and-email:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      PUBLIC_CLIENT_URL: ${{ vars.PUBLIC_CLIENT_URL }}
      REPORT_EMAIL_TO: ${{ inputs.recipients || vars.REPORT_EMAIL_TO || '01257166@email.ntou.edu.tw' }}

    steps:
      - name: Publish permanent site and email latest report
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File 'D:\Website\GITHUB-DAILY-PUBLISH.ps1' `
            -SkipScrape `
            -ScrapeStatusOverride 'Cloud scrape 03:00'
