name: NewsAgg Daily Publish and Report

on:
  # 04:25 Asia/Taipei, then the runner waits for 04:30 freeze and 04:40 send.
  schedule:
    - cron: '25 20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Preflight does not send email; send runs the daily edition"
        type: choice
        options: [preflight, send]
        default: preflight
      recipients:
        description: "Optional comma-separated recipient emails; blank uses configured list"
        type: string
        required: false
      save_recipients:
        description: "Save entered emails as additional recipients for future scheduled runs"
        type: boolean
        required: false
        default: false

concurrency:
  group: newsagg-daily-pipeline
  cancel-in-progress: false

jobs:
  publish-and-email:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      # Local server/.env may override these fallback values on the self-hosted runner.
      SMTP_USER: ${{ secrets.SMTP_USER || 'newsaggtest123@gmail.com' }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: NewsAgg <newsaggtest123@gmail.com>
      REPORT_EMAIL_TO: ${{ vars.REPORT_EMAIL_TO || '' }}
      NEWSAGG_MANUAL_RECIPIENTS: ${{ inputs.recipients || '' }}
    steps:
      - name: Save entered recipients for future runs
        if: github.event_name == 'workflow_dispatch' && inputs.save_recipients
        shell: powershell
        run: |
          if (-not $env:NEWSAGG_MANUAL_RECIPIENTS) { throw 'Enter recipient emails before selecting Save recipients.' }
          $saved = & node.exe 'D:\Website\server\scripts\save-daily-recipients.mjs' $env:NEWSAGG_MANUAL_RECIPIENTS
          if ($LASTEXITCODE -ne 0) { throw 'Recipient validation failed.' }
          $credentialInput = "protocol=https`nhost=github.com`nusername=icygit6`n`n"
          $passwordLine = ($credentialInput | git credential fill) | Where-Object { $_ -like 'password=*' } | Select-Object -First 1
          if (-not $passwordLine) { throw 'GitHub credential unavailable on the self-hosted runner.' }
          $gh = (Get-Command gh.exe -ErrorAction SilentlyContinue).Source
          if (-not $gh) { $gh = Join-Path $env:ProgramFiles 'GitHub CLI\gh.exe' }
          if (-not (Test-Path -LiteralPath $gh)) { throw 'GitHub CLI is unavailable on the self-hosted runner.' }
          $env:GH_TOKEN = $passwordLine.Substring(9)
          try {
            & $gh variable set REPORT_EMAIL_TO --repo $env:GITHUB_REPOSITORY --body $saved
            if ($LASTEXITCODE -ne 0) { throw 'Could not save the recipient variable in GitHub.' }
            $confirmed = & $gh variable get REPORT_EMAIL_TO --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0 -or $confirmed.Trim() -ne $saved) { throw 'Saved recipient verification failed.' }
            Write-Host "Saved $(@($saved -split ',').Count) additional recipient(s) for future runs."
          } finally {
            Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
            $passwordLine = $null
          }
      - name: Validate daily pipeline without sending mail
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preflight'
        shell: powershell
        run: |
          $flags = @('-DryRun')
          if ($env:NEWSAGG_MANUAL_RECIPIENTS) { $flags += @('-Recipients', $env:NEWSAGG_MANUAL_RECIPIENTS) }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File 'D:\Website\RUN-NEWSAGG-DAILY.ps1' @flags
          if ($LASTEXITCODE -ne 0) { throw "Daily preflight failed with exit code $LASTEXITCODE." }

      - name: Freeze edition and send daily brief
        if: github.event_name == 'schedule' || inputs.mode == 'send'
        shell: powershell
        run: |
          $flags = @()
          if ($env:NEWSAGG_MANUAL_RECIPIENTS) { $flags += @('-Recipients', $env:NEWSAGG_MANUAL_RECIPIENTS) }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File 'D:\Website\RUN-NEWSAGG-DAILY.ps1' @flags
          if ($LASTEXITCODE -ne 0) { throw "Daily delivery failed with exit code $LASTEXITCODE." }
