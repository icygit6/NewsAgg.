name: NewsAgg Daily Publish and Report

on:
  schedule:
    - cron: "0 5 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      recipients:
        description: "Email penerima (pisahkan dengan koma)"
        required: false
        type: string

concurrency:
  group: newsagg-daily-publish
  cancel-in-progress: false

jobs:
  publish-and-email:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      REPORT_EMAIL_TO: ${{ inputs.recipients || vars.REPORT_EMAIL_TO }}

    steps:
      - name: Rotate tunnel and email latest report
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File 'D:\Website\GITHUB-DAILY-PUBLISH.ps1' `
            -SkipScrape `
            -ScrapeStatusOverride 'Cloud scrape 03:00'
