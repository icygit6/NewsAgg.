name: NewsAgg Daily Publish and Report

on:
  # Windows Task Scheduler is the sole daily delivery owner.
  workflow_dispatch:
    inputs:
      recipients:
        description: "Email recipients, separated by commas / 電子郵件收件者（以逗號分隔）"
        required: false
        type: string

concurrency:
  group: newsagg-daily-publish
  cancel-in-progress: false

jobs:
  publish-and-email:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      # The sender address is not secret; only its Google App Password is.
      SMTP_USER: newsaggtest123@gmail.com
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: NewsAgg <newsaggtest123@gmail.com>
      # Scheduled runs keep this list until this workflow is edited again.
      # A manual run may temporarily override it through the recipients input.
      REPORT_EMAIL_TO: ${{ inputs.recipients || '01257166@email.ntou.edu.tw,01257168@email.ntou.edu.tw,01257169@email.ntou.edu.tw' }}

    steps:
      - name: Validate daily pipeline without sending mail
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File 'D:\Website\RUN-NEWSAGG-DAILY.ps1' `
            -DryRun
